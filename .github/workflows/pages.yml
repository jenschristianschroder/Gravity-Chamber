name: Test and deploy Gravity Run
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Check JavaScript syntax
        run: |
          node --check run-core.js
          node --check run-progress.js
          node --check run-input.js
          node --check run-audio.js
          node --check run-renderer.js
          node --check run-guide.js
          node --check game.js
      - name: Test physics, motion controls, rendering data, and game flow
        run: node --test tests/*.test.cjs
      - name: Assemble static site
        run: |
          mkdir -p _site
          cp index.html styles.css run-core.js run-progress.js run-input.js run-audio.js run-renderer.js run-guide.js game.js manifest.webmanifest icon.svg .nojekyll _site/
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
